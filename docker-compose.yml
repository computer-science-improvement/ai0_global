services:

  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ai0global}
      POSTGRES_USER:     ${POSTGRES_USER:-ai0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # 5433 on host to avoid conflict with a local postgres
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai0} -d ${POSTGRES_DB:-ai0global}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Automation (long-running Nest.js service) ───────────────────────────────
  # Production only: docker compose --profile prod up -d
  # Dev: pnpm run dev:automation  (runs outside Docker)
  #
  # Image is pre-built in GitHub Actions and pushed to GHCR — the prod box
  # has tight RAM and OOMs during a local TS compile. To rebuild locally
  # (e.g. for dev testing), set AUTOMATION_IMAGE to an empty string and add
  # back the `build:` block.
  automation:
    profiles: ["prod"]
    image: ${AUTOMATION_IMAGE:-ghcr.io/computer-science-improvement/ai0_global-automation:latest}
    restart: unless-stopped
    ports:
      # 3001 на хості, якщо локально вже зайнятий 3000
      - "${AUTOMATION_PORT:-3001}:3000"
    environment:
      # Host's .env decides which environment this container runs as.
      # Valid values: production | dev-stage | local-development.
      # Channel-config service refuses to boot on any other value.
      NODE_ENV:          ${NODE_ENV:-production}
      PORT:              3000
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-ai0global}
      POSTGRES_USER:     ${POSTGRES_USER:-ai0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_URL:         redis://redis:6379
    env_file: .env
    volumes:
      # Persist structured Winston logs across container restarts; read by LogAnalyzerAgent
      - ./logs/automation:/repo/apps/automation/logs
      # Mount config so channels.json / proxies.json / sources/* changes go live
      # on `docker compose up -d` WITHOUT a rebuild (prod box has tight RAM).
      - ./apps/automation/config:/repo/apps/automation/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Dashboard (React SPA serving Phase 1 tracking data) ──────────────────────
  dashboard:
    profiles: ["prod"]
    # CI builds + pushes this image; the box pulls it. `build:` stays as a
    # local fallback (`up --build dashboard`). VITE_* are baked at build time.
    image: ${DASHBOARD_IMAGE:-ghcr.io/computer-science-improvement/ai0_global-dashboard:latest}
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_AUTH_MODE:       ${VITE_AUTH_MODE:-}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME:-}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      automation:
        condition: service_started

  # ─── Caddy (TLS reverse proxy for the public domain) ─────────────────────────
  # Fronts the dashboard on :80/:443 with an automatic Let's Encrypt certificate
  # for $PUBLIC_DOMAIN (dev-stage default: dev.ai0.global). The dashboard's own
  # nginx still serves the SPA + proxies /api + /auth, so Caddy only adds TLS and
  # the bare-domain entrypoint. Requires the domain's DNS → this host and ports
  # 80/443 open in the droplet firewall (ACME challenge + traffic).
  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-dev.ai0.global}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_started

  # ─── Pipeline (job — run on demand or via cron) ──────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    profiles: ["pipeline"]
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-ai0global}
      POSTGRES_USER:     ${POSTGRES_USER:-ai0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount .env so node --env-file=../../.env works from /repo/apps/pipeline
      - ./.env:/repo/.env:ro
      # Mount data dirs so parsed JSON is accessible on host (WORKDIR is /repo/apps/pipeline)
      - ./apps/pipeline/src/data:/repo/apps/pipeline/src/data
      - ./apps/pipeline/src/tools/additional-data:/repo/apps/pipeline/src/tools/additional-data

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
