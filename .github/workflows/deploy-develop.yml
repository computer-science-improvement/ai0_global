name: Deploy develop -> dev-stage

# Every push to `develop` builds a fresh image and ships it to the dev-stage
# DigitalOcean droplet. Mirrors the historical main->prod flow, just retargeted.
#
# Secrets required (set in GitHub repo settings):
#   DEV_HOST        — IP or hostname of the dev-stage server
#   DEV_USER        — SSH user on that server (usually `root` for DO droplets)
#   DEV_SSH_KEY     — private SSH key authorized on the dev-stage server
#   GH_PAT          — optional fine-grained PAT with packages:read for GHCR pull
#                     (falls back to GITHUB_TOKEN when not set)

on:
  push:
    branches: [develop]

env:
  IMAGE_NAME:           ghcr.io/${{ github.repository_owner }}/ai0_global-automation
  IMAGE_NAME_DASHBOARD: ghcr.io/${{ github.repository_owner }}/ai0_global-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image names
        id: image
        run: |
          echo "name=$(echo ${IMAGE_NAME} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "dashboard=$(echo ${IMAGE_NAME_DASHBOARD} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push automation (dev tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/automation/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev-latest
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dashboard SPA. VITE_* are baked at build time. Read from repo Variables
      # OR Secrets (vars.* preferred; falls back to secrets.* so it works no
      # matter which tab they were added under). VITE_AUTH_MODE=token ships
      # token login, VITE_TG_BOT_USERNAME=<bot> Telegram login; both empty → dev.
      - name: Build and push dashboard (dev tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          build-args: |
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || secrets.VITE_AUTH_MODE }}
            VITE_TG_BOT_USERNAME=${{ vars.VITE_TG_BOT_USERNAME || secrets.VITE_TG_BOT_USERNAME }}
          tags: |
            ${{ steps.image.outputs.dashboard }}:dev-latest
            ${{ steps.image.outputs.dashboard }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev-stage server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/ai0_global

            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            # GHCR auth so `docker compose pull` can fetch the dev image
            echo "${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Apply pending DB migrations BEFORE starting the new image, so the
            # schema is always ahead of (or level with) the code. Forward-only,
            # idempotent, fail-fast — a bad migration aborts the deploy (set -e)
            # instead of booting automation against a half-migrated DB.
            bash database/migrate.sh

            # Pin the dev image tags here so the box .env doesn't have to carry
            # *_IMAGE lines (compose's default is the prod ':latest', which dev
            # never publishes → "manifest unknown"). These exports override .env
            # for this compose invocation only. NODE_ENV still comes from .env.
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export AUTOMATION_IMAGE="ghcr.io/${OWNER}/ai0_global-automation:dev-latest"
            export DASHBOARD_IMAGE="ghcr.io/${OWNER}/ai0_global-dashboard:dev-latest"

            docker compose --profile prod pull automation dashboard
            # --remove-orphans clears containers for services no longer in the
            # compose file (e.g. the removed bundled caddy) instead of leaving
            # them dangling and warning on every deploy.
            docker compose --profile prod up -d --remove-orphans automation dashboard
            docker compose --profile prod restart automation

            # Best-effort cleanup — never fail the deploy on it (a concurrent
            # prune from an overlapping run returns non-zero: "a prune operation
            # is already running").
            docker image prune -f || true
