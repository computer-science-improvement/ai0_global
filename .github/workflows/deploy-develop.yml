name: Deploy develop -> dev-stage

# Every push to `develop` builds a fresh image and ships it to the dev-stage
# DigitalOcean droplet. Mirrors the historical main->prod flow, just retargeted.
#
# Secrets required (set in GitHub repo settings):
#   DEV_HOST        — IP or hostname of the dev-stage server
#   DEV_USER        — SSH user on that server (usually `root` for DO droplets)
#   DEV_SSH_KEY     — private SSH key authorized on the dev-stage server
#   GH_PAT          — optional fine-grained PAT with packages:read for GHCR pull
#                     (falls back to GITHUB_TOKEN when not set)

on:
  push:
    branches: [develop]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai0_global-automation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image name
        id: image
        run: echo "name=$(echo ${IMAGE_NAME} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (dev tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/automation/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev-latest
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev-stage server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/ai0_global

            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            # GHCR auth so `docker compose pull` can fetch the dev image
            echo "${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # AUTOMATION_IMAGE and NODE_ENV come from the host's .env file
            # (NODE_ENV=dev-stage, AUTOMATION_IMAGE=...:dev-latest).
            docker compose --profile prod pull automation
            docker compose --profile prod up -d automation
            docker compose --profile prod restart automation

            docker image prune -f
