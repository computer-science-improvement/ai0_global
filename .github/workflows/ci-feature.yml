name: CI feature branches

# Cheap checks on every work-branch push and every PR: lint, type-check and
# the offline unit tests (node:test, fakes only — no service start, no
# external/paid API calls). Intentionally no Docker build, no deploy — those
# run on develop/main.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies (automation + dashboard)
        run: pnpm install --frozen-lockfile --filter automation... --filter dashboard...

      - name: Lint (automation)
        run: pnpm --filter automation run lint

      - name: Type-check automation (no emit)
        # `nest build` would also emit; tsc --noEmit only type-checks.
        run: pnpm --filter automation exec tsc --noEmit -p tsconfig.json

      - name: Unit tests (automation)
        # Offline by construction (fakes for LLM/Telegram/HTTP). The dead proxy
        # makes any accidental outbound HTTP fail fast instead of going out.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: pnpm --filter automation test

      - name: Type-check dashboard (no emit)
        # Same tsc the dashboard `build` script runs before `vite build`.
        run: pnpm --filter dashboard exec tsc --noEmit -p tsconfig.json

      - name: No personal contact on the public pages (spec 026 FR-009)
        # Ads are ordered via the Telegram ad account or the request form; a mail link
        # or a webmail address must never ship again. `-l` lists file names only, so the
        # log never echoes a matched address. The pattern is split so this file holds no
        # literal mail link. Same check as apps/dashboard/src/lib/no-personal-contact.test.ts.
        run: |
          if grep -rIliE 'mail''to:|@(gmail|googlemail)\.' apps/dashboard/src apps/dashboard/index.html apps/dashboard/public; then
            echo "::error::Personal contact found in the files above (spec 026 FR-009)"
            exit 1
          fi

  schema-bootstrap:
    # Builds a fresh Postgres 16 from database/init.sql + every migration in
    # order and re-applies the recent ones to prove idempotency (spec 007 T004).
    # Throwaway service container — no secrets, no external calls.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai0
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai0 -d ai0_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: ai0
      PGPASSWORD: ci
      PGDATABASE: ai0_ci
    steps:
      - uses: actions/checkout@v4

      - name: Apply init.sql + migrations, re-apply 042+
        run: bash database/ci-bootstrap-check.sh
