name: CI feature branches

# Cheap checks on every feature/* push: lint and TS type-check only.
# Intentionally no Docker build, no deploy — those run on develop/main.

on:
  push:
    branches:
      - 'feature/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install dependencies (automation workspace only)
        run: pnpm install --frozen-lockfile --filter automation...

      - name: Lint
        run: pnpm --filter automation run lint

      - name: Type-check (no emit)
        # `nest build` would also emit; we only want type-checking to keep this
        # job fast. tsc with --noEmit walks the workspace and fails on any TS
        # error without producing dist/.
        run: pnpm --filter automation exec tsc --noEmit
