name: Snapshot main (build only, no deploy)

# Every untagged push to `main` produces a `:snapshot-<sha>` image in GHCR.
# Does NOT deploy anywhere. Acts as a build canary: confirms `main` builds
# cleanly before a release tag is cut.

on:
  push:
    branches: [main]
    # Tags handled by release-prod.yml — exclude them here to avoid duplicate
    # builds when a tag is pushed.
    tags-ignore:
      - '**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai0_global-automation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image name
        id: image
        run: echo "name=$(echo ${IMAGE_NAME} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (snapshot tag only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/automation/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:snapshot-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
