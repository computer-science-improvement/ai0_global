server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative (`Location: /login?…`). Behind the host Caddy (TLS)
  # an absolute redirect would be built from this server's own scheme/port,
  # i.e. `http://host:80/…`.
  absolute_redirect off;

  # Backend routes are forwarded to automation UNCHANGED. `proxy_pass` has no
  # URI part, so nginx does not rewrite the path: `/api/strategies` reaches the
  # backend as `/api/strategies` (its controllers are mounted under `api/…`),
  # and the bare-root controllers (`auth`, `tracking`, …) keep their prefix too.
  # Stripping `/api` here used to 404 every `api/*` controller — including the
  # public LiqPay callback (`/api/payments/liqpay/callback`) and the TikTok
  # OAuth callback (`/api/tiktok/oauth/callback`).
  #
  # This prefix list mirrors the dev proxy in vite.config.ts 1:1 (plus /health),
  # so prod routes exactly like `pnpm dev`. Add a prefix in BOTH places when a
  # new bare-root controller is introduced. These are never gated here: the API
  # guards itself.
  location ~ ^/(api|auth|tracking|activity|scheduled-posts|settings|stats|r)(/|$) {
    proxy_pass http://automation:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://automation:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ── Server-side gate for the app shell (spec 028 FR-006) ───────────────────
  # `/app` and `/app/*` get index.html only with a live session: every request
  # asks the backend's `/auth/check` (204 / 401 / 503, cookie only, no body).
  #  - 401 → 302 /login?reason=<code>&next=<original uri>  (next LAST: it is the
  #    raw $request_uri and may carry its own `?`/`&`; the login page takes the
  #    rest of the query string as `next`)
  #  - backend down / 5xx → a static 503 page, never /login (no redirect loop)
  # `= /app` + `^~ /app/` (not a bare prefix) so `/applications` is not gated.
  # `/`, `/login`, `/report/*`, `/assets/*` and the API prefixes stay public.
  location = /_auth_check {
    internal;
    proxy_pass http://automation:3000/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location = /app {
    auth_request /_auth_check;
    auth_request_set $auth_reason $upstream_http_x_auth_reason;
    error_page 401 = @to_login;
    error_page 500 502 503 504 =503 /auth-unavailable.html;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location ^~ /app/ {
    auth_request /_auth_check;
    auth_request_set $auth_reason $upstream_http_x_auth_reason;
    error_page 401 = @to_login;
    error_page 500 502 503 504 =503 /auth-unavailable.html;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location @to_login {
    add_header Cache-Control "no-store" always;
    return 302 /login?reason=$auth_reason&next=$request_uri;
  }

  location = /auth-unavailable.html {
    internal;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
