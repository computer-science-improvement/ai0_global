server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend routes are forwarded to automation UNCHANGED. `proxy_pass` has no
  # URI part, so nginx does not rewrite the path: `/api/strategies` reaches the
  # backend as `/api/strategies` (its controllers are mounted under `api/…`),
  # and the bare-root controllers (`auth`, `tracking`, …) keep their prefix too.
  # Stripping `/api` here used to 404 every `api/*` controller — including the
  # public LiqPay callback (`/api/payments/liqpay/callback`) and the TikTok
  # OAuth callback (`/api/tiktok/oauth/callback`).
  #
  # This prefix list mirrors the dev proxy in vite.config.ts 1:1 (plus /health),
  # so prod routes exactly like `pnpm dev`. Add a prefix in BOTH places when a
  # new bare-root controller is introduced.
  location ~ ^/(api|auth|tracking|activity|scheduled-posts|settings|stats|r)(/|$) {
    proxy_pass http://automation:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://automation:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
