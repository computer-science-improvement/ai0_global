<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ai0 — temporarily unavailable</title>
  <!-- Served by nginx (503) when the sign-in check for /app can't reach the
       backend (spec 028). Self-contained: the app bundle may be what's broken.
       Mirrors the dashboard tokens in src/index.css. -->
  <style>
    :root {
      --color-canvas: #1b1b1b; --color-surface-2: #242424; --color-hairline: #2e2e2e;
      --color-ink: #ededed; --color-ink-muted: #a0a0a0; --color-ink-dim: #6f6f6f;
      --color-accent: #3ecf8e; --color-accent-deep: #24b47e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--color-canvas); color: var(--color-ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 420px; width: 100%; padding: 32px; border-radius: 12px;
      background: var(--color-surface-2); border: 1px solid var(--color-hairline);
    }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 20px; color: var(--color-ink-muted); }
    button {
      width: 100%; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--color-accent); color: #0b1f16; font: inherit; font-weight: 600;
    }
    button:hover { background: var(--color-accent-deep); }
    small { display: block; margin-top: 12px; color: var(--color-ink-dim); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>ai0 is temporarily unavailable</h1>
    <p>The server could not check your sign-in right now. Your session is not affected. Try again in a minute.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small id="auto">Retrying automatically…</small>
  </main>
  <script>
    // Retry with a growing pause; a reload re-runs the server-side check.
    (function () {
      var n = 1;
      try {
        n = Number(sessionStorage.getItem('ai0-auth-retry') || 0) + 1;
        sessionStorage.setItem('ai0-auth-retry', String(n));
      } catch (e) { /* storage blocked: fixed 5 s */ }
      var wait = Math.min(60, 5 * n);
      document.getElementById('auto').textContent = 'Retrying automatically in ' + wait + ' s…';
      setTimeout(function () { location.reload(); }, wait * 1000);
    })();
  </script>
</body>
</html>
